# Configuration that produced the archived USGS fits (fitted_functions/F01..F25).
#
# NOTE ON REPRODUCTION
# The archived fits were produced once, with maxfev = 1,000,000, and are shipped
# in the data deposit. This repository does NOT re-run them by default: a full
# run takes several days of wall clock. Use `make verify-fits` to check that this
# configuration reproduces the archived values on a random subset of samples.
#
# `size_columns: auto` selects every USGS sieve parameter code present in the
# input (43 grades). This matters: the archived fits used all available grades,
# not only the twelve principal ones. See docs/reproduction.md.

project:
  name: psd-gig-usgs

paths:
  input_data_file: data/usgs_psd_samples_qc.csv
  output_root: outputs/fit_usgs

data:
  size_columns: auto
  size_pattern: '^p[0-9]+$'
  size_lookup:
    kind: file
    path: data/reference/sieve_sizes_all43.csv

runtime:
  maxfev: 1000000
  progress: true
  overwrite: false
  limit_samples:
  checkpoint_every: 1000
  grid_chunk_samples: 100
  write_grid_search_all: true
  progress_tracker: true
  progress_log_every: 100
