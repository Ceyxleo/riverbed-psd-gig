# CONUS (USGS) riverbed samples: 19,765 samples x up to 43 sieve grades.
#
# Every function is grid-searched (the default mode) and the lowest-BIC fit per sample
# is written to outputs/fit_usgs/fitted_functions/. `--mode base` writes single-guess
# fits to outputs/fit_usgs/base_fits/ instead, and never touches the grid results.
#
# `size_columns: auto` selects every USGS sieve parameter code present in the input,
# so a sample is fitted on all the grades it has (up to 43), not only the twelve
# principal ones. Restricting to the twelve changes the fit for 924 of the 19,765
# samples, by a median of 6.4 BIC units.
#
# maxfev = 20,000. Nine functions (F05, F06, F10, F12, F14, F15, F16, F18, F25) are
# shipped from the original grid runs at maxfev = 1e6 -- re-running those three
# SciPy-integrated CDFs here would take weeks. See README, "Fitting".

project:
  name: psd-gig-usgs

paths:
  input_data_file: data/usgs_psd_samples_qc.csv
  output_root: outputs/fit_usgs

data:
  size_columns: auto
  size_pattern: '^p[0-9]+$'
  size_lookup:
    kind: file
    path: data/reference/sieve_sizes_all43.csv

runtime:
  maxfev: 20000
  progress: true
  overwrite: true
  limit_samples:
  grid_chunk_samples: 100
  write_grid_search_all: false
  progress_tracker: true
  progress_log_every: 250
