[project]
name = "psd-gig"
version = "1.0.0"
description = "Fitting and evaluation of candidate riverbed particle-size distribution functions."
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "pyyaml", "tqdm", "matplotlib"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
